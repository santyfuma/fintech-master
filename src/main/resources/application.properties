spring.application.name=fintech

# Directorio de los archivos JSON de datos (relativo al directorio de trabajo o absoluto).
fintech.datos.directorio=data

# Cantidad de notificaciones que devuelve la consulta de "recientes" por usuario.
# 0 = sin límite. Valor definitivo pendiente (docs/CONTEXTO.md, sección 11).
fintech.notificaciones.recientes-por-usuario=0

# ---------------------------------------------------------------- reglas de negocio
# Todos los valores siguientes que el enunciado no fija son PROVISIONALES
# (docs/CONTEXTO.md, sección 11, y docs/INFORME_TECNICO.md, decisiones).

# Puntos por cada "unidad" del valor (ejemplo del enunciado 4.4) y bono por operación
# programada ejecutada con éxito (valor no fijado por el enunciado: provisional).
fintech.puntos.recarga=1
fintech.puntos.retiro=2
fintech.puntos.transferencia=3
fintech.puntos.unidad=100
fintech.puntos.bono-programada=10

# Reversiones: tipos permitidos y plazo (provisional).
fintech.reversion.recargas=true
fintech.reversion.retiros=false
fintech.reversion.transferencias=true
fintech.reversion.plazo-horas=24

# Alertas (provisional).
fintech.notificaciones.umbral-saldo-bajo=10000
fintech.notificaciones.anticipacion-programadas-horas=24

# Operaciones programadas: retiros permitidos y ejecución automática simulada.
fintech.programadas.permitir-retiros=true
fintech.programadas.automatico=true
fintech.programadas.intervalo-ms=60000

# Detección de comportamiento inusual (umbrales provisionales; ver PoliticaDeteccion).
fintech.deteccion.ventana-consecutivas-minutos=5
fintech.deteccion.minimo-consecutivas=3
fintech.deteccion.factor-monto-alto=3
fintech.deteccion.minimo-historial-monto=3
fintech.deteccion.ventana-destino-minutos=60
fintech.deteccion.minimo-destino=3
fintech.deteccion.ventana-fragmentacion-minutos=10
fintech.deteccion.minimo-billeteras-origen=2
fintech.deteccion.minimo-frecuencia=5
fintech.deteccion.factor-frecuencia=3
fintech.deteccion.minimo-historial-horario=5
fintech.deteccion.tolerancia-horas=1

# Grafo de transferencias: peso por defecto (CANTIDAD o MONTO).
fintech.grafo.peso-por-defecto=CANTIDAD

# Catálogo de beneficios: NO definido por el enunciado. Los valores siguientes son de
# DEMOSTRACIÓN (ficticios) y coinciden con los canjes de datos-demo/; deben reemplazarse
# si el profesor define un catálogo. Formato: CODIGO|Descripción|costo;...
fintech.beneficios.catalogo=BONO_CAFE|Bono de café|500;DESC_COMISION|Descuento del 50% en una comisión|2000;CINE|Entrada de cine|3500;MILLAS|1000 millas de viaje|8000
# Ventajas por nivel: NO definidas por el enunciado. Texto de DEMOSTRACIÓN (separado por ';');
# solo se muestran, no cambian ninguna regla financiera.
fintech.niveles.ventajas.bronce=Acceso al catálogo de beneficios
fintech.niveles.ventajas.plata=Acceso al catálogo de beneficios;Prioridad en soporte
fintech.niveles.ventajas.oro=Acceso al catálogo de beneficios;Prioridad en soporte;Reportes mensuales detallados
fintech.niveles.ventajas.platino=Acceso al catálogo de beneficios;Prioridad en soporte;Reportes mensuales detallados;Asesor personal

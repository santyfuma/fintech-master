<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fintech · Billeteras digitales</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="marca">Fintech<span>billeteras</span></div>
        <nav id="menu" aria-label="Secciones"></nav>
        <p class="aviso-academico">Simulación académica. Sin autenticación: cualquiera puede operar
            sobre cualquier usuario. No use datos reales.</p>
    </aside>
    <div class="principal">
        <header class="topbar">
            <button class="boton-menu" id="botonMenu" aria-label="Abrir menú">☰</button>
            <h1 id="titulo">Dashboard</h1>
            <label class="selector-usuario">Usuario
                <select id="usuarioActual" aria-label="Usuario seleccionado"></select>
            </label>
        </header>
        <main id="contenido" aria-live="polite"></main>
    </div>
</div>
<div class="modal-fondo" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
        <header><h2 id="modalTitulo"></h2><button class="cerrar" id="modalCerrar" aria-label="Cerrar">×</button></header>
        <div id="modalCuerpo"></div>
    </div>
</div>
<div class="cargando" id="cargando" hidden><div class="spinner"></div></div>
<div class="mensajes" id="mensajes" aria-live="assertive"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pantallas.js"></script>
<script src="js/app.js"></script>
</body>
</html>

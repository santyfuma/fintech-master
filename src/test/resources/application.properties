spring.application.name=fintech

# Las pruebas que arrancan Spring sin indicar otro directorio usan uno dentro de target/,
# nunca la carpeta data/ del proyecto.
fintech.datos.directorio=target/datos-pruebas-contexto
fintech.notificaciones.recientes-por-usuario=0
# En las pruebas no corre la tarea periódica: se dispara a mano con el Clock controlado.
fintech.programadas.automatico=false
